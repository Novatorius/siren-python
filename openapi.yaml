openapi: 3.1.0
info:
  title: Siren Affiliate Platform API
  version: 0.1.0
  summary: Headless affiliate & incentive tracking API for the Siren SaaS.
  description: |
    The Siren API lets any commerce stack record sales, refunds, and referred
    visits, subscribe to program events via signed webhooks, and reconcile
    Siren's ledger against its own.

    This document describes the **developer-facing surface**: event ingestion,
    webhooks, API keys, and read endpoints for reconciliation. The full admin
    surface used by the Siren dashboard is intentionally out of scope here.

    Every request carries a bearer token. An API key
    (`Authorization: Bearer sk_live_...`) sends events and does nothing else,
    so on Siren Cloud only the `/event/...` routes accept it. The webhook,
    API key and reconciliation routes need a signed-in dashboard session's
    token, and the reconciliation routes also take a connected site's OAuth
    token that holds `connect:records:read`. Any other credential gets a 401.

    Success bodies are not wrapped. A record is a bare object. The webhook
    and API key lists are bare arrays, and the reconciliation lists are
    `{ items, total, page, perPage, totalPages }`. A failure is
    `{ "error": { "message", "code"?, "context" } }`, and a few routes answer
    `{ "error": "<message>" }`. A request whose fields fail their checks gets
    a 400 with `context.type` of `VALIDATION_FAILED` and the messages in
    `context.failedValidations`.
  contact:
    name: Siren
    url: https://sirenaffiliates.com
  license:
    name: Proprietary
servers:
  - url: https://api.sirenaffiliates.com/siren/v1
    description: Production
  - url: http://localhost:8080/siren/v1
    description: Local development
security:
  - apiKey: []
tags:
  - name: Events
    description: Ingest commerce and tracking events.
  - name: Webhooks
    description: |
      Subscribe to program events, delivered as signed HTTP callbacks.

      Each delivery is a `POST` with `X-Siren-Signature: sha256=<hex>` (an
      HMAC-SHA256 of the raw body keyed by the subscription's signing secret),
      `X-Siren-Event` (the event type) and `X-Siren-Delivery` (the event id,
      `evt_...`, which stays the same across retries). For a subscription made
      through `POST /webhooks` the body is the event's payload alone, such as
      `{"conversionId": 991}`. A subscription that belongs to a connected site
      gets a versioned envelope instead:
      `{version, id, type, kind, occurredAt, propertyId, match,
      originPropertyId, data, records, recordDetail, omittedRecords,
      recordsTruncated}`.
  - name: API Keys
    description: Manage API keys.
  - name: Reconciliation
    description: Read Siren's ledger to reconcile against your own records.
paths:
  /event/sale:
    post:
      tags: [Events]
      operationId: recordSale
      summary: Record a completed sale
      description: |
        Records a sale so conversions and payouts compute for the attributed
        collaborator. `total` is in major currency units (9.99 = $9.99). If
        `items` are supplied, reward pools compute `amount × quantity` per line;
        otherwise `total` is treated as one line. The opportunity id is returned
        in the `X-Siren-OID` response header.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalePayload' }
      responses:
        '200':
          description: |
            The sale was handled. The body says what came of it. Sending the
            same `source` and `externalId` again records nothing new and
            answers `duplicate`.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleOutcome' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: The sale could not be recorded and nothing was saved. It is safe to send it again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /event/refund:
    post:
      tags: [Events]
      operationId: recordRefund
      summary: Record a refund
      description: |
        Reverses a previously recorded sale, matched by `(externalId, source)`.
        Returns 404 if no matching sale transaction exists. While the
        organization's processing is paused the refund is queued (202) and the
        sale is looked up when the queue replays.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPayload' }
      responses:
        '200':
          description: Refund accepted. The body is empty.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/site-visited:
    post:
      tags: [Events]
      operationId: recordSiteVisited
      summary: Record a referred visit
      description: |
        Records a referred visit and opens an opportunity attributed to the
        given collaborator. A visit for a collaborator that does not exist or
        is not active writes nothing and answers `not_attributed` with a
        `reason`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteVisitedPayload' }
      responses:
        '200':
          description: The visit was handled. The body says what came of it.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitOutcome' }
        '202':
          description: |
            The organization's processing is paused. The visit was queued and
            will be recorded on the returned opportunity.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/{eventSlug}:
    post:
      tags: [Events]
      operationId: recordEvent
      summary: Record a custom event
      description: |
        Ingests any event type registered on the organization, including custom
        event types. The three built-in slugs are `sale`, `refund`, and
        `site-visited`. Custom slugs are lowercase letters and digits joined
        by single hyphens. An unknown slug answers 404. The slugs a connected
        site forwards, such as `sale-triggered`, need that exact
        `event:{slug}` scope, and `event:*` does not reach them.
      parameters:
        - name: eventSlug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
          example: loyalty-points-earned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      parameters:
        - { $ref: '#/components/parameters/Number200' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Subscriptions (bare array). The total is in `x-siren-estimated-count`.
          headers:
            x-siren-estimated-count: { $ref: '#/components/headers/EstimatedCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: |
        Registers a URL to receive event callbacks. The response includes
        `signingSecret`, returned **once** — store it to verify future
        deliveries. Deliveries are signed with
        `X-Siren-Signature: sha256=<hmac-sha256(rawBody, signingSecret)>`.
        `events` is stored as given and is not checked against the catalog,
        so a name Siren does not send is accepted and never delivered. An
        organization holds at most 100 subscriptions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionCreate' }
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      signingSecret:
                        type: string
                        description: HMAC signing secret. Returned once.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/events:
    get:
      tags: [Webhooks]
      operationId: listWebhookEventTypes
      summary: List the event types a webhook can subscribe to
      description: |
        The catalog the dashboard's event picker is built from. It names
        exactly the event types Siren sends.
      responses:
        '200':
          description: Event types (bare array).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookCatalogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /webhooks/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Subscription (bare object).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api-keys:
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: List API keys
      description: Organization admins only. Revoked keys are listed too.
      parameters:
        - { $ref: '#/components/parameters/Number200' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: API keys (bare array, without raw key material). The total is in `x-siren-estimated-count`.
          headers:
            x-siren-estimated-count: { $ref: '#/components/headers/EstimatedCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Creates a new API key. Organization admins only. The plaintext
        `rawKey` (`sk_live_...`) is returned **once** and cannot be retrieved
        later. A key may hold event scopes only (`event:*` or
        `event:{slug}`), or `*`. A resource scope such as `programs:read` is
        refused with a 400. An organization holds at most 250 active keys.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      rawKey:
                        type: string
                        description: Plaintext key. Returned once.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api-keys/{id}:
    delete:
      tags: [API Keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Revoked. The body is the revoked key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversions:
    get:
      tags: [Reconciliation]
      operationId: listConversions
      summary: List conversions
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /transactions:
    get:
      tags: [Reconciliation]
      operationId: listTransactions
      summary: List transactions
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /obligations:
    get:
      tags: [Reconciliation]
      operationId: listObligations
      summary: List obligations
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payouts:
    get:
      tags: [Reconciliation]
      operationId: listPayouts
      summary: List payouts
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_...
      description: An API key minted in the Siren dashboard or via createApiKey.
  headers:
    XSirenOID:
      description: The opportunity (tracking) id associated with the event.
      schema: { type: integer }
    EstimatedCount:
      description: Total number of records across all pages.
      schema: { type: integer }
  parameters:
    Number:
      name: number
      in: query
      description: Page size. A value above 200 is lowered to 200. Below 1 is refused with a 400.
      schema: { type: integer, minimum: 1, maximum: 200, default: 10 }
    Number200:
      name: number
      in: query
      description: Page size. A value above 200 is lowered to 200. Below 1 is refused with a 400.
      schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
    Offset:
      name: offset
      in: query
      description: The first row to return.
      schema: { type: integer, minimum: 0, default: 0 }
  schemas:
    SalePayload:
      type: object
      required: [source, externalId, total, trackingId]
      properties:
        source:
          type: string
          description: Commerce source identifier.
          minLength: 1
          maxLength: 249
          example: stripe
        externalId:
          type: string
          description: Your order/transaction id; used to match refunds later. A number is accepted too.
          minLength: 1
          maxLength: 32
          example: cs_test_a1b2c3
        total:
          type: number
          description: Order total in major currency units.
          minimum: 0
          maximum: 999999999.99
          example: 49.99
        trackingId:
          type: integer
          description: Opportunity id from the Siren tracking cookie / attribution.
          minimum: 0
          example: 4021
        currency:
          type: string
          description: |
            A currency code the organization uses. Every line is recorded in
            it. Without it the lines carry no currency and read as the
            organization's default.
          example: USD
        items:
          type: array
          maxItems: 500
          description: The lines may add up to no more than 999,999,999.99.
          items: { $ref: '#/components/schemas/LineItem' }
    LineItem:
      type: object
      required: [amount]
      properties:
        externalId: { type: string, maxLength: 255 }
        name: { type: string, maxLength: 255, example: Pro Plan (annual) }
        quantity: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        amount:
          type: number
          description: Per-unit price in major currency units.
          minimum: 0
          maximum: 999999999.99
          example: 49.99
    RefundPayload:
      type: object
      required: [source, externalId]
      properties:
        source: { type: string, minLength: 1, maxLength: 249, example: stripe }
        externalId: { type: string, minLength: 1, maxLength: 32, example: cs_test_a1b2c3 }
    SiteVisitedPayload:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId: { type: integer, minimum: 1, example: 88 }
        userId: { type: integer, minimum: 1, example: 12345 }
    SaleOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [created, recorded, duplicate, unattributed, ignored]
        created: { type: boolean }
        transactionId: { type: integer, nullable: true }
        conversions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
        message: { type: string }
        reason:
          type: string
          description: Present when a recorded sale earned nothing.
          enum: [no_engagement, engagement_used, engagement_ended, not_awarded]
    VisitOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [attributed, recorded, not_attributed, queued]
        attributed: { type: boolean }
        opportunityId: { type: integer, nullable: true }
        queued: { type: boolean }
        message: { type: string }
        reason:
          type: string
          enum: [collaborator_not_found, collaborator_not_active]
    QueuedEvent:
      type: object
      properties:
        status: { type: string, enum: [queued] }
        queued: { type: boolean, enum: [true] }
        message: { type: string }
    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        targetUrl: { type: string, format: uri }
        urlValid: { type: boolean }
        urlProblem: { type: string, nullable: true }
        events:
          type: array
          items: { type: string }
        status: { type: string, example: active }
        description: { type: string }
        propertyId: { type: integer, nullable: true }
        oauthClientId: { type: string, nullable: true }
        dateCreated: { type: string, format: date-time, nullable: true }
        dateModified: { type: string, format: date-time, nullable: true }
    WebhookCatalogEntry:
      type: object
      properties:
        event: { $ref: '#/components/schemas/WebhookEventType' }
        category: { type: string, example: Conversions }
        label: { type: string, example: A conversion was approved }
    WebhookSubscriptionCreate:
      type: object
      required: [targetUrl, events]
      properties:
        targetUrl: { type: string, format: uri, example: https://example.com/webhooks/siren }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          example: ['conversion.approved', 'payout.paid']
        description: { type: string, maxLength: 255 }
    WebhookEventType:
      type: string
      description: A subscribable event type. Use `*` to subscribe to all.
      enum:
        - '*'
        - allocation.completed
        - collaborator.created
        - collaborator.deactivated
        - collaborator.registered
        - collaborator.updated
        - conversion.approved
        - conversion.created
        - conversion.rejected
        - conversion.renewed
        - coupon.applied
        - credit.issued
        - credit.redeemed
        - currency.created
        - currency.deleted
        - distribution.completed
        - engagement.awarded
        - engagement.completed
        - engagement.created
        - fulfillment.created
        - fulfillment.updated
        - lead.created
        - metrics.updated
        - obligation.completed
        - obligation.created
        - opportunity.created
        - opportunity.invalidated
        - payout.created
        - payout.paid
        - program.created
        - refund.created
        - renewal.created
        - sale.created
        - transaction.completed
        - transaction.created
    ApiKey:
      type: object
      properties:
        id: { type: integer }
        keyPrefix: { type: string, example: sk_live_a1b2c3d4 }
        label: { type: string }
        status: { type: string, example: active }
        propertyId: { type: integer, nullable: true }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        dateCreated: { type: string, format: date-time, nullable: true }
        dateModified: { type: string, format: date-time, nullable: true }
    ApiKeyCreate:
      type: object
      required: [scopes]
      properties:
        label: { type: string, example: Production server }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          example: ['event:*']
          description: |
            Required. Event scopes only: `event:*`, or `event:{slug}` for one
            event type. `*` is also accepted.
        expiresAt:
          type: string
          format: date-time
          description: When the key stops working. Must be in the future.
        propertyId:
          type: integer
          description: Ties the key to one of the organization's Properties.
    Error:
      type: object
      description: |
        `error` is polymorphic. Siren's REST layer returns an object with
        `message`, `context`, and a stable `code` on refusals that have one
        (such as `missing_scope`, `site_disconnected`, `plan_required` or
        `not_permitted`). A few routes return a plain string message. Clients
        must handle both.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                code: { type: string }
                context:
                  description: |
                    Details of the refusal. A failed field check carries
                    `{type: VALIDATION_FAILED, failedValidations: {field: [message]}}`.
                    An empty context may be encoded as `[]`.
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: array
                      maxItems: 0
  responses:
    PaginatedList:
      description: |
        One page of records with its paging details. The total is also in the
        `x-siren-estimated-count` response header.
      headers:
        x-siren-estimated-count: { $ref: '#/components/headers/EstimatedCount' }
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items: { type: object, additionalProperties: true }
              total: { type: integer }
              page: { type: integer }
              perPage: { type: integer }
              totalPages: { type: integer }
    Queued:
      description: |
        The organization's processing is paused. The event was queued and
        will be processed once processing resumes. When the queue is full the
        answer is a 429 instead.
      headers:
        X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueuedEvent' }
    BadRequest:
      description: The request was malformed, or a field failed its check.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or wrong kind of credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The API key lacks the required scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
